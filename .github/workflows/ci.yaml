name: Build test and deploy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: support-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon spotlessCheck test integrationTest jacocoTestReport bootJar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage-reports
          path: |
            build/reports/
            build/test-results/
      - name: Build container and test persistence and restore
        run: |
          printf 'DB_PASSWORD=%s\n' "$(openssl rand -hex 24)" > .env
          docker compose up -d --build --wait --wait-timeout 240
          bash scripts/smoke.sh
          bash scripts/verify-operations.sh
      - run: docker compose down -v
        if: always()
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}
  deploy:
    needs: publish
    runs-on: [self-hosted, linux, support-training]
    environment: training
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - name: Prepare persistent deployment files
        env:
          TRAINING_DB_PASSWORD: ${{ secrets.TRAINING_DB_PASSWORD }}
        run: |
          mkdir -p "$HOME/support-training/scripts"
          cp source/compose.yaml "$HOME/support-training/"
          cp source/scripts/* "$HOME/support-training/scripts/"
          printf 'DB_PASSWORD=%s\nAPP_PORT=8080\n' "$TRAINING_DB_PASSWORD" > "$HOME/support-training/.env"
          chmod 600 "$HOME/support-training/.env"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_READ_TOKEN }}
      - name: Deploy and check running service
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
        run: bash "$HOME/support-training/scripts/deploy.sh" "$IMAGE"
      - name: Record deployment
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
        run: echo "Deployed and smoke-tested $IMAGE" >> "$GITHUB_STEP_SUMMARY"
